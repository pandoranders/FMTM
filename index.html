<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fce0eb">
  <title>From Mediocre To Magic</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./supabase-config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="banner">
      <h1><img src="./banner.jpg" alt="From Mediocre To Magic" width="2002" height="786" fetchpriority="high"></h1>
    </header>

    <section class="auth-gate" id="auth-gate" aria-labelledby="auth-title">
      <h2 id="auth-title">Logg inn</h2>
      <form class="login-form" id="login-form" method="post">
        <label for="username">Brukernavn<input id="username" name="username" value="unibear" autocomplete="username" readonly></label>
        <label for="password">Passord<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" id="sign-in" type="submit" disabled>Logg inn</button>
      </form>
      <p class="status-message" id="auth-message" aria-live="polite"></p>
    </section>

    <section id="app-content" aria-label="Oppussingslista" hidden>
      <div class="room-grid" id="task-list"></div>
      <p id="empty-state" class="empty" hidden></p>
      <p id="feedback" class="status-message" role="status"></p>

      <footer class="tools">
        <details class="add-panel" id="add-panel">
          <summary>Legg til oppgave</summary>
          <form class="add-form" id="add-form">
            <label for="task-input">Oppgave<input id="task-input" type="text" maxlength="180" autocomplete="off" required></label>
            <label id="room-field" for="task-room" hidden>Rom<select id="task-room"></select></label>
            <label id="parent-field" for="task-parent" hidden>Underoppgave til<select id="task-parent"></select></label>
            <button class="primary" type="submit">Legg til</button>
            <button class="text-button" id="cancel-edit" type="button" hidden>Avbryt</button>
          </form>
        </details>
        <div class="toolbar">
          <div class="filters" role="group" aria-label="Vis oppgaver">
            <button type="button" data-filter="all" aria-pressed="true">Alle</button>
            <button type="button" data-filter="active" aria-pressed="false">Åpne</button>
            <button type="button" data-filter="done" aria-pressed="false">Ferdige</button>
          </div>
          <span id="remaining" aria-live="polite"></span>
          <button class="text-button" id="clear-done" type="button">Fjern ferdige</button>
        </div>
      </footer>
    </section>
    <div class="account-controls">
      <button class="text-button" id="sign-out" type="button" hidden>Logg ut</button>
    </div>
  </main>
</body>
</html>
