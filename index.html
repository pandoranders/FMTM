<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2A7D0">
  <title>From Mediocre To Magic</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./style.css?v=unicorn-fabs">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./supabase-config.js"></script>
  <script defer src="./app.js?v=unicorn-bounce"></script>
</head>
<body>
  <main class="shell">
    <header class="banner">
      <h1><img src="./banner.png?v=complete" alt="From Mediocre To Magic" width="1233" height="496" fetchpriority="high"></h1>
    </header>

    <section class="auth-gate" id="auth-gate" aria-labelledby="auth-title">
      <h2 id="auth-title">Logg inn</h2>
      <form class="login-form" id="login-form" method="post">
        <label for="username">Brukernavn<input id="username" name="username" autocomplete="username" readonly></label>
        <label for="password">Passord<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" id="sign-in" type="submit" disabled>Logg inn</button>
      </form>
      <p class="status-message" id="auth-message" aria-live="polite"></p>
      <button class="text-button" id="sign-out-denied" type="button" hidden>Logg ut</button>
    </section>

    <section class="auth-gate" id="recovery-gate" aria-labelledby="recovery-title" hidden>
      <h2 id="recovery-title">Velg nytt passord</h2>
      <form class="login-form" id="recovery-form" method="post">
        <label for="new-password">Nytt passord<input id="new-password" type="password" autocomplete="new-password" required></label>
        <label for="repeat-password">Gjenta passord<input id="repeat-password" type="password" autocomplete="new-password" required></label>
        <button class="primary" type="submit">Lagre passord</button>
        <button class="text-button" id="cancel-recovery" type="button">Avbryt</button>
      </form>
      <p class="status-message" id="recovery-message" role="status"></p>
    </section>

    <section id="app-content" aria-label="Oppussingslista" hidden>
      <div class="room-grid" id="task-list"></div>
      <p id="empty-state" class="empty" hidden></p>
      <p id="feedback" class="status-message" role="status"></p>

      <footer class="tools">
        <button class="fab fab-admin" id="open-task-manager" type="button" aria-label="Admin" title="Admin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16 4l4 4M4 20l4.5-1 12-12a2.8 2.8 0 0 0-4-4l-12 12L4 20Z"/></svg></button>
        <button class="fab fab-motivation" id="motivation-button" type="button" aria-label="Gi meg motivasjon!" title="Gi meg motivasjon!"><span class="fab-unicorn" aria-hidden="true">&#x1F984;</span></button>
        <div class="motivation-overlay" id="motivation-overlay" hidden><div class="motivation-card"><p id="motivation-message" role="status" aria-live="polite" aria-atomic="true"></p></div></div>
      </footer>
      <dialog class="task-manager" id="task-manager" aria-labelledby="task-manager-title">
        <header class="manager-header">
          <button class="text-button" id="sign-out" type="button">Logg ut</button>
          <h2 id="task-manager-title">Admin</h2>
          <form method="dialog"><button class="text-button" type="submit" autofocus>Lukk</button></form>
        </header>
        <p id="manager-feedback" class="status-message" role="status"></p>
        <section class="manager-add-task" aria-labelledby="task-form-title">
          <h3 id="task-form-title">Legg til oppgave</h3>
          <form class="add-form" id="add-form" aria-labelledby="task-form-title">
            <label for="task-input">Oppgave<input id="task-input" type="text" maxlength="180" autocomplete="off" required></label>
            <label id="room-field" for="task-room" hidden>Rom<select id="task-room"></select></label>
            <label id="parent-field" for="task-parent" hidden>Underoppgave til<select id="task-parent"></select></label>
            <div class="form-actions">
              <button class="primary" type="submit">Legg til</button>
              <button class="text-button" id="cancel-edit" type="button" hidden>Avbryt</button>
            </div>
          </form>
        </section>
        <details class="manager-panel">
          <summary>Oppgaver</summary>
          <div class="manager-list-header">
            <button class="text-button" id="clear-done" type="button">Fjern ferdige</button>
          </div>
          <div class="toolbar">
            <div class="filters" role="group" aria-label="Vis oppgaver">
              <button type="button" data-filter="all" aria-pressed="true">Alle</button>
              <button type="button" data-filter="active" aria-pressed="false">Åpne</button>
              <button type="button" data-filter="done" aria-pressed="false">Ferdige</button>
            </div>
            <span id="remaining" aria-live="polite"></span>
          </div>
          <p id="managed-empty" class="empty" hidden>Ingen oppgaver ennå.</p>
          <ul class="managed-list" id="managed-tasks"></ul>
        </details>
        <details class="manager-panel">
          <summary>Kategori/rom</summary>
          <p id="room-feedback" class="status-message" role="status"></p>
          <form class="add-form" id="room-form" hidden>
            <label for="room-name">Romnavn<input id="room-name" type="text" maxlength="80" required></label>
            <div class="form-actions">
              <button class="primary" type="submit">Legg til rom</button>
              <button class="text-button" id="cancel-room-edit" type="button" hidden>Avbryt</button>
            </div>
          </form>
          <ul class="managed-list" id="managed-rooms"></ul>
        </details>
      </dialog>
    </section>
  </main>
</body>
</html>
