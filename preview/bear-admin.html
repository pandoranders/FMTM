<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bjørnepost | Admin</title>
  <link rel="stylesheet" href="./style.css?v=bear-messages">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./supabase-config.js"></script>
  <script defer src="./bear-admin.js?v=delete-posts"></script>
</head>
<body>
  <main class="auth-gate bear-admin">
    <h1>Bjørnepost</h1>
    <form id="bear-login" class="login-form">
      <label>E-post<input name="email" type="email" autocomplete="username" required></label>
      <label>Passord<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary">Logg inn</button>
    </form>
    <form id="bear-editor" class="login-form" hidden>
      <label>Tittel<input name="title" maxlength="120" required></label>
      <label>Beskjed<textarea name="body" rows="6" maxlength="4000" required></textarea></label>
      <button class="primary">Publiser beskjed</button>
      <button class="text-button" id="bear-logout" type="button">Logg ut</button>
    </form>
    <p id="bear-admin-status" role="status"></p>
    <section id="bear-posts" aria-labelledby="bear-posts-title" hidden>
      <h2 id="bear-posts-title">Publiserte poster</h2>
      <p id="bear-posts-status" role="status"></p>
      <ul id="bear-post-list"></ul>
    </section>
  </main>
</body>
</html>
